[General]
auto-profiles = no

[Mapping speakers]
description = Speakers
device-strings = alphaplus_output
channel-map = left,right
paths-output = alphaplus-output-speakers alphaplus-output-earpiece
direction = output

[Mapping headphones]
description = Headphones
device-strings = alphaplus_output
channel-map = left,right
paths-output = alphaplus-output-headphones
direction = output

[Mapping microphone]
description = Microphone
device-strings = alphaplus_microphone
channel-map = left,right
paths-input = alphaplus-input-stereo-mic alphaplus-input-bottom-mic alphaplus-input-top-mic alphaplus-input-headset-mic alphaplus-input-aux-mic
direction = input

[Mapping displayport]
description = HDMI / DisplayPort
device-strings = alphaplus_displayport
channel-map = left,right
exact-channels = no
paths-output = alphaplus-output-displayport
direction = output

[Profile displayport-microphone]
description = Digital Output (HDMI / DisplayPort) + Analog Stereo Input
output-mappings = displayport
input-mappings = microphone
priority = 9000

[Profile headphones-microphone]
description = Analog Stereo Duplex (Headphones)
output-mappings = headphones
input-mappings = microphone
priority = 10000

[Profile speakers-microphone]
description = Analog Stereo Duplex (Speakers)
output-mappings = speakers
input-mappings = microphone
priority = 8000
