monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.platform-sound.speakers" } ]
    actions = {
      update-props = {
        # Static graphs load at node creation; ALSA Props strings are limited to 511 bytes.
        audioconvert.filter-graph.0 = {
          nodes = [
            { type = builtin name = left label = copy }
            { type = builtin name = right label = copy }
            {
              type = builtin name = top label = mixer
              control = { "Gain 1" = 0.5 "Gain 2" = 0.5 }
            }
            {
              type = builtin name = bottom label = mixer
              control = { "Gain 1" = 0.5 "Gain 2" = 0.5 }
            }
          ]
          links = [
            { output = "left:Out" input = "top:In 1" }
            { output = "right:Out" input = "top:In 2" }
            { output = "left:Out" input = "bottom:In 1" }
            { output = "right:Out" input = "bottom:In 2" }
          ]
          inputs = [ "left:In" "right:In" ]
          outputs = [ "top:Out" "bottom:Out" ]
        }
      }
    }
  }
]
