monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-sound" } ]
    actions = {
      update-props = {
        # Expose the shared capture PCM as selectable desktop input ports.
        api.alsa.use-ucm = false
        device.profile-set = "alphaplus.conf"
        api.acp.probe-rate = 48000
        api.acp.auto-profile = false
        api.acp.auto-port = false
        api.acp.disable-pro-audio = true
        api.acp.hidden-ports = [
          alphaplus-input-bottom-mic
          alphaplus-input-top-mic
          alphaplus-input-aux-mic
        ]
        # Keep codec gain at stock levels and apply user volume in software.
        api.alsa.soft-mixer = true
        device.description = "LG LM-G820N"
      }
    }
  }
  {
    matches = [ { node.name = "alsa_output.platform-sound.speakers" } ]
    actions = {
      update-props = {
        node.name = "alsa_output.platform-sound.speakers"
        node.description = "LG LM-G820N Speakers"
        node.nick = "Speakers"
        device.icon_name = "audio-speakers"
        # Lock the speaker pipeline to 48 kHz to match the fixed SEC_MI2S/TFADSP backend.
        audio.allowed-rates = [ 48000 ]
      }
    }
  }
  {
    matches = [ { node.name = "alsa_output.platform-sound.headphones" } ]
    actions = {
      update-props = {
        node.name = "alsa_output.platform-sound.headphones"
        node.description = "LG LM-G820N Headphones"
        node.nick = "Headphones"
        device.icon_name = "audio-headphones"
        audio.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
      }
    }
  }
  {
    matches = [ { device.name = "alsa_card.platform-sound" device.profile.name = "displayport" } ]
    actions = {
      update-props = {
        node.name = "alsa_output.platform-sound.displayport"
        node.description = "LG LM-G820N HDMI / DisplayPort"
        node.nick = "HDMI / DisplayPort"
        device.icon_name = "video-display"
        # Let ALSA expose the channel layouts and valid sample formats from ELD.
        audio.channels = 0
        api.alsa.use-chmap = true
        iec958.codecs = [ PCM ]
      }
    }
  }
  {
    matches = [ { device.name = "alsa_card.platform-sound" device.profile.name = "microphone" } ]
    actions = {
      update-props = {
        node.name = "alsa_input.platform-sound.microphone"
        node.description = "LG LM-G820N Microphone"
        node.nick = "Microphone"
      }
    }
  }
]

device.profile.priority.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-sound" } ]
    actions = {
      update-props = {
        priorities = [ headphones-microphone displayport-microphone speakers-microphone ]
      }
    }
  }
]

wireplumber.components = [
  {
    name = device/rescan-alphaplus-profiles.lua
    type = script/lua
    provides = hooks.device.profile.alphaplus
  }
]

wireplumber.profiles = {
  main = {
    hooks.device.profile.alphaplus = required
  }
}
