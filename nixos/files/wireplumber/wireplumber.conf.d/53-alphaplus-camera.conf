monitor.libcamera.rules = [
  {
    matches = [ { api.libcamera.path = "~imx363 .*" } ]
    actions = {
      update-props = { node.description = "Rear Main Camera" }
    }
  }
  {
    matches = [ { api.libcamera.path = "~imx351 .*" } ]
    actions = {
      update-props = { node.description = "Rear Ultrawide Camera" }
    }
  }
  {
    matches = [ { api.libcamera.path = "~s5k3m5 .*" } ]
    actions = {
      update-props = { node.description = "Rear Telephoto Camera" }
    }
  }
  {
    matches = [ { api.libcamera.path = "~imx520 .*" } ]
    actions = {
      update-props = { node.description = "Front Camera" }
    }
  }
  {
    matches = [ { api.libcamera.path = "~irs2381c .*" } ]
    actions = {
      update-props = { node.description = "Front ToF Camera" }
    }
  }
]
