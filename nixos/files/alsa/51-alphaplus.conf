# The machine initializes playback; ACP paths select its current backend.
pcm.alphaplus_output {
    type hw
    card LMG820N
    device 0
}

# The machine permanently connects this dedicated frontend to DisplayPort.
pcm.alphaplus_displayport {
    type hw
    card LMG820N
    device 2
}

# Separate frontends give SCO playback and capture independent DSP sessions.
pcm.alphaplus_bluetooth {
    type asym
    playback.pcm {
        type hw
        card LMG820N
        device 3
    }
    capture.pcm {
        type hw
        card LMG820N
        device 4
    }
}

# alsactl init connects the capture backend before open; this hook configures ADC routing.
pcm.alphaplus_microphone {
    type hooks
    slave.pcm "hw:LMG820N,1"
    hooks.0 {
        type ctl_elems
        hook_args [
            { name "AIF2_CAP Mixer SLIM TX0" value 0 lock false preserve false }
            { name "AIF2_CAP Mixer SLIM TX1" value 0 lock false preserve false }
            { name "AIF2_CAP Mixer SLIM TX2" value 0 lock false preserve false }
            { name "AIF2_CAP Mixer SLIM TX3" value 0 lock false preserve false }
            { name "AIF2_CAP Mixer SLIM TX4" value 0 lock false preserve false }
            { name "AIF2_CAP Mixer SLIM TX5" value 0 lock false preserve false }
            { name "AIF2_CAP Mixer SLIM TX6" value 0 lock false preserve false }
            { name "AIF2_CAP Mixer SLIM TX7" value 0 lock false preserve false }
            { name "AIF2_CAP Mixer SLIM TX8" value 0 lock false preserve false }
            { name "AIF3_CAP Mixer SLIM TX0" value 0 lock false preserve false }
            { name "AIF3_CAP Mixer SLIM TX1" value 0 lock false preserve false }
            { name "AIF3_CAP Mixer SLIM TX2" value 0 lock false preserve false }
            { name "AIF3_CAP Mixer SLIM TX3" value 0 lock false preserve false }
            { name "AIF3_CAP Mixer SLIM TX4" value 0 lock false preserve false }
            { name "AIF3_CAP Mixer SLIM TX5" value 0 lock false preserve false }
            { name "AIF3_CAP Mixer SLIM TX6" value 0 lock false preserve false }
            { name "AIF3_CAP Mixer SLIM TX7" value 0 lock false preserve false }
            { name "AIF3_CAP Mixer SLIM TX8" value 0 lock false preserve false }
            { name "AIF1_CAP Mixer SLIM TX0" value 0 lock false preserve false }
            { name "AIF1_CAP Mixer SLIM TX1" value 0 lock false preserve false }
            { name "AIF1_CAP Mixer SLIM TX2" value 0 lock false preserve false }
            { name "AIF1_CAP Mixer SLIM TX3" value 0 lock false preserve false }
            { name "AIF1_CAP Mixer SLIM TX4" value 0 lock false preserve false }
            { name "AIF1_CAP Mixer SLIM TX5" value 1 lock false preserve false }
            { name "AIF1_CAP Mixer SLIM TX6" value 1 lock false preserve false }
            { name "AIF1_CAP Mixer SLIM TX7" value 0 lock false preserve false }
            { name "AIF1_CAP Mixer SLIM TX8" value 0 lock false preserve false }
            { name "DEC5 Volume" value 84 lock false preserve false }
            { name "DEC6 Volume" value 84 lock false preserve false }
            { name "MultiMedia2 Mixer SLIMBUS_0_TX" value 1 lock false preserve false }
        ]
    }
}
