CARDINFO{id}!="LMG820N", GOTO="alphaplus_end"

# Initialize DPCM capture routing and WCD934x SLIM TX channels before PipeWire
# probes alphaplus_microphone (alsa-lib ctl_elems hooks run after hw_params).
CTL{reset}="mixer"
CTL{name}="MultiMedia2 Mixer SLIMBUS_0_TX", CTL{values}="on"
CTL{reset}="mixer"
CTL{name}="AIF1_CAP Mixer SLIM TX5", CTL{values}="on"
CTL{reset}="mixer"
CTL{name}="AIF1_CAP Mixer SLIM TX6", CTL{values}="on"
CTL{reset}="mixer"
CTL{name}="CDC_IF TX5 MUX", CTL{values}="DEC5"
CTL{reset}="mixer"
CTL{name}="CDC_IF TX6 MUX", CTL{values}="DEC6"
CTL{reset}="mixer"
CTL{name}="DEC5 Volume", CTL{values}="84"
CTL{reset}="mixer"
CTL{name}="DEC6 Volume", CTL{values}="84"

CTL{reset}="mixer"
CTL{name}="SEC_MI2S_RX Voice Mixer VoiceMMode1", CTL{values}="on"
CTL{reset}="mixer"
CTL{name}="VoiceMMode1 Capture Mixer SLIMBUS_0_TX", CTL{values}="on"
RESULT="true"

LABEL="alphaplus_end"
